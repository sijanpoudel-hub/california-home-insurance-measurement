name: Additional research checks and revised report

on:
  push:
    branches: ["analysis/remaining-checks-2026-11-27"]
    paths:
      - "tools/extended_analysis.py"
      - "tools/build_revised_report.py"
      - ".github/workflows/extended_checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extended-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript --vanilla -e 'install.packages(c("readxl", "dplyr"), repos = Sys.getenv("RSPM", unset = "https://cloud.r-project.org"))'
      - name: Install supplementary and document dependencies
        run: python -m pip install pandas openpyxl python-docx reportlab
      - name: Download original official inputs
        run: Rscript --vanilla tools/download_public_inputs.R
      - name: Reproduce original analysis and all 44 reported-result checks
        run: Rscript --vanilla run_all.R
      - name: Export matched input for independent supplementary calculations
        shell: Rscript {0}
        run: |
          x <- readRDS("data_clean/california_federal_matched_2018_2021.rds")
          write.csv(x, "outputs/extension_matched_input.csv", row.names = FALSE, na = "")
      - name: Execute additional checks and overlapping-release reconciliation
        run: python tools/extended_analysis.py
      - name: Generate revised Word and PDF reports
        run: python tools/build_revised_report.py
      - name: Package analysis and aggregate numerical outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path(".")
          with zipfile.ZipFile("deliverables/California_Additional_Analysis_Package.zip","w",zipfile.ZIP_DEFLATED) as z:
              paths=list(Path("deliverables").glob("*"))
              paths+=list(Path("outputs").glob("*.csv"))+list(Path("outputs").glob("*.json"))
              paths+=list(Path("outputs").glob("*session_info.txt"))
              paths+=[Path("tools/extended_analysis.py"),Path("tools/build_revised_report.py"),Path("docs/ADDITIONAL_ANALYSIS.md")]
              for p in paths:
                  if p.name in {"extension_matched_input.csv","extended_release_zip_differences.csv","extended_definition_membership.csv"} or p.suffix==".zip" or not p.is_file():
                      continue
                  z.write(p,p.as_posix())
          PY
      - name: Preserve revised documents and results on the analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p validation/extended
          for file in outputs/extended_*.csv; do
            case "$(basename "$file")" in
              extended_release_zip_differences.csv|extended_definition_membership.csv) continue ;;
            esac
            cp "$file" validation/extended/
          done
          cp outputs/extended_*.json validation/extended/
          cp outputs/reproducibility_checks.csv validation/extended/original_reproducibility_checks.csv
          cp outputs/input_manifest.csv validation/extended/original_input_manifest.csv
          git add deliverables validation/extended
          git commit -m "Record executed robustness checks and revised research reports"
          git push origin HEAD:analysis/remaining-checks-2026-11-27
      - name: Save all aggregate outputs and documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: california-additional-analysis
          retention-days: 30
          if-no-files-found: warn
          path: |
            deliverables/
            outputs/*.csv
            !outputs/extension_matched_input.csv
            !outputs/extended_release_zip_differences.csv
            !outputs/extended_definition_membership.csv
            outputs/*.json
            outputs/*session_info.txt
            tools/extended_analysis.py
            tools/build_revised_report.py
            docs/ADDITIONAL_ANALYSIS.md
